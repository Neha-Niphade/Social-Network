{% extends "base.html" %}

{% block content %}

<h2 class="mt-4">🔖 Saved Tweets</h2>

{% for tweet in tweets %}

<div class="card mt-3">

    <div class="card-body">

        <h5 class="card-title">
            👤 {{ tweet.user.username }}
        </h5>

        <p class="card-text">
            {{ tweet.text }}
        </p>

        {% if tweet.photo %}
            <img src="{{ tweet.photo.url }}"
                 class="img-fluid mb-3">
        {% endif %}

        <small class="text-muted">
            {{ tweet.created_at }}
        </small>

        <div class="mt-3">

            <a href="{% url 'tweet_detail' tweet.id %}"
               class="btn btn-outline-primary btn-sm">
                View Tweet
            </a>

            <form method="POST"
                  action="{% url 'tweet_bookmark' tweet.id %}"
                  class="d-inline">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-outline-warning btn-sm">
                    🔖 Remove
                </button>

            </form>

        </div>

    </div>

</div>

{% empty %}

<p class="text-muted mt-3">
    You haven't saved any tweets yet.
</p>

{% endfor %}

{% endblock %}
