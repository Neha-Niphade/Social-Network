{% extends "base.html" %}

{% block content %}

<h1>Recent Tweets</h1>

{% for tweet in tweets %}
    <div class="card mb-3">
        <div class="card-body">
            {{ tweet.text }}
        </div>
    </div>
{% empty %}
    <p>No tweets yet.</p>
{% endfor %}

{% endblock %}git commit -m "Implement reusable layout using Django template inheritance"
